.modal-box{

  box-sizing:border-box !important;

.exercise-actions{margin-top:18px !important}


.exercise-nav{

.exercise-transition{

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

function normalizeSession(s){
  if(!s || !s.key || !workouts[s.key] || !Array.isArray(s.items)) return null;
  const w=workouts[s.key];
  const old=Array.isArray(s.items)?s.items:[];
  s.items=w.exercises.map((e,i)=>{
    const prev=old[i]||{};
    const count=e.sets||1;
    const prevSets=Array.isArray(prev.sets)?prev.sets:[];
    return {
      done:!!prev.done,
      effort:prev.effort||'',
      hana:prev.hana||null,
      repDone:Array.isArray(prev.repDone)?prev.repDone.slice():[],
      sets:Array.from({length:count},(_,j)=>{
        const p=prevSets[j]||{};
        return {
          reps:p.reps!==undefined?p.reps:((e.category==='flex'||e.category==='pole')?'':(e.target||e.reps||'')),
          weight:p.weight!==undefined?p.weight:((e.category==='flex'||e.category==='pole')?'':(e.weight||'')),
          done:!!p.done
        };
      })
    };
  });
  if(s.current<0 || s.current>=w.exercises.length) s.current=0;
  return s;
}
state.session=normalizeSession(state.session);
if(state.session){
  state.selected=state.session.key;
  state.view='workout';
  saveActiveSession();
} else {
  clearActiveSession();
}

function loadActiveSession(){

    const raw=localStorage.getItem(SESSION_KEY);

}
function saveActiveSession(){

function clearActiveSession(){localStorage.removeItem(SESSION_KEY)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

}

function exerciseSummary(e){
  if(e.category==='flex'||e.category==='pole'){
    if(e.type==='timed'||e.type==='timed_sets')return e.target||`${e.duration}s`;
    if(e.type==='reps'||e.type==='reps_sets')return e.target||'Repetições';
    if(e.type==='skill'||e.type==='sequence')return e.target||'Prática guiada';
    return e.target||'Concluir';
  }
  if(e.type==='checklist') return 'Mobilidade';
  if(e.customSets) return e.customSets.map(x=>x[0]+' × '+x[1]+' kg').join(' · ');
  if(e.sets) return `${e.sets} × ${esc(e.reps)}${e.weight?' · '+esc(e.weight)+' kg':''}`;
  return 'Prescrição a definir';
}
function referenceBlock(e){

}

  // Algumas entradas antigas do catálogo não tinham category no próprio exercício.

function getBisetPosition(index){
  const e=workouts[state.session.key].exercises[index];
  if(!e.pair)return '';
  const pairIndex=workouts[state.session.key].exercises.findIndex(x=>x.name===e.pair);
  return pairIndex<index?'2/2':'1/2';
}
function timerBox(){
  return `<div class="timer"><div class="row">
    <div style="display:flex;align-items:center;gap:8px">
      <span>⏱️</span><div><div class="sub">Descanso</div><strong>${fmt(state.timer)}</strong></div>

  </div></div>`;

function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(Math.max(0,n%60)).padStart(2,'0')}
function playTimerSound(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660,ctx.currentTime+0.12);
    gain.gain.setValueAtTime(0.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.055,ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.22);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+0.24);
  }catch(e){}
}
function startTimer(seconds=60){
  clearInterval(state.timerInterval);
  state.timerInterval=null;
  state.timer=Math.max(1,seconds);
  state.timerPaused=false;
  render();
  state.timerInterval=setInterval(()=>{
    if(state.timerPaused)return;
    state.timer=Math.max(0,state.timer-1);
    const el=document.querySelector('.timer strong');
    if(el)el.textContent=fmt(state.timer);
    if(state.timer<=0){
      clearInterval(state.timerInterval);
      state.timerInterval=null;
      state.timerPaused=false;
      playTimerSound();
      render();
    }
  },1000);
}

}

 },1000);

function toggleRep(ex,i){

function runTrainingTimer(ex,duration){

function completeFlexSet(ex,i){state.session.items[ex].sets[i].done=true;if(state.session.items[ex].sets.every(x=>x.done))state.session.items[ex].done=true;saveActiveSession();render();}
function setHanaScale(v){state.session.items[state.session.current].hana=v;saveActiveSession();render();}
function setVal(ex,i,k,v){state.session.items[ex].sets[i][k]=v;saveActiveSession()}
function setSet(ex,i,checked){
  const s=state.session;
  const w=workouts[s.key];
  const e=w.exercises[ex];

  s.items[ex].sets[i].done=checked;

  if(!checked){
    s.items[ex].done=false;
    saveActiveSession();
    render();
    return;
  }

  clearInterval(state.timerInterval);
  state.timerInterval=null;
  state.timer=0;
  state.timerPaused=false;

  const sets=s.items[ex].sets;
  const exerciseComplete=sets.length>0 && sets.every(x=>x.done);
  if(exerciseComplete) s.items[ex].done=true;

  // BISSET FLOW:
  // Exercise 1, set 1 -> Exercise 2, set 1 -> 1 min rest -> Exercise 1, set 2.
  // After the final round, continue to the next exercise.
  if(e.pair){
    const pairIndex=w.exercises.findIndex(x=>x.name===e.pair);

    if(pairIndex>=0){
      const pairItem=s.items[pairIndex];
      const currentIsFirstHalf=pairIndex>ex;
      const pairHasSameSet=!pairItem.sets[i] ? false : pairItem.sets[i].done;

      // First half: jump to the paired second half.
      if(currentIsFirstHalf && !pairHasSameSet){
        pairItem.activeSet=i;
        saveActiveSession();
        showExerciseTransition(
          e.name,
          `${getBisetPosition(ex)} · agora vem ${w.exercises[pairIndex].name}`,
          true,
          ()=>{
            s.current=pairIndex;
            s.drill=true;
            saveActiveSession();
            render();
          }
        );
        return;
      }

      // Second half: start rest, then return to the first half for the next round.
      if(!currentIsFirstHalf && pairHasSameSet){
        const firstItem=pairItem;
        const moreRounds=firstItem.sets.some(x=>!x.done);

        if(moreRounds){
          saveActiveSession();
          s.current=pairIndex;
          s.drill=true;
          startTimer(60);
          return;
        }

        // Final round of the biset: advance to the next exercise after a brief transition.
        const next=ex+1;
        if(next<w.exercises.length){
          saveActiveSession();
          showExerciseTransition(
            e.name,
            `Biset concluído · próximo: ${w.exercises[next].name}`,
            true,
            ()=>{
              s.current=next;
              s.drill=true;
              saveActiveSession();
              startTimer(60);
            }
          );
          return;
        }
      }
    }
  }

  // Completing a normal exercise: transition, then next exercise + rest.
  if(exerciseComplete){
    const next=ex+1;
    if(next<w.exercises.length){
      saveActiveSession();
      showExerciseTransition(
        e.name,
        `Concluído · próximo: ${w.exercises[next].name}`,
        false,
        ()=>{
          s.current=next;
          s.drill=true;
          saveActiveSession();
          startTimer(60);
        }
      );
      return;
    }
  }

  // Normal set: one-minute rest.
  saveActiveSession();
  startTimer(60);
}
function showExerciseTransition(name,text,isBiset,onDone){
  const icon=isBiset?'↔️':'✨';
  const extra=isBiset?`<div class="transition-biset">Biset · ${esc(getBisetPosition(state.session.current))}</div>`:'';
  document.body.insertAdjacentHTML('beforeend',`<div class="exercise-transition"><div class="transition-card">
    <div class="transition-icon">${icon}</div>
    <div class="transition-title">${esc(name)} concluído!</div>
    ${extra}
    <div class="sub" style="font-size:14px;line-height:1.4">${esc(text)}</div>
  </div></div>`);
  window.setTimeout(()=>{
    document.querySelector('.exercise-transition')?.remove();
    onDone();
  },isBiset?1800:1500);
}
function toggleExercise(i,checked){
  const s=state.session,w=workouts[s.key],e=w.exercises[i],item=s.items[i];

  if(!checked){
    item.done=false;
    item.sets.forEach(x=>x.done=false);
    saveActiveSession();
    render();
    return;
  }

  // "Finalizar exercício" means all its sets are complete.
  item.sets.forEach(x=>x.done=true);
  item.done=true;

  const next=i+1;
  saveActiveSession();

  if(next<w.exercises.length){
    showExerciseTransition(
      e.name,
      `Concluído · próximo: ${w.exercises[next].name}`,
      !!e.pair,
      ()=>{
        s.current=next;
        s.drill=true;
        saveActiveSession();
        startTimer(60);
      }
    );
  }else{
    // Last exercise: finishing it prepares the full-workout completion flow.
    s.current=i;
    saveActiveSession();
    finishAttempt();
  }
}

function jumpExercise(i){state.session.current=i;state.drill=true;saveActiveSession();render()}
function openDrill(i){state.session.current=i;state.drill=true;saveActiveSession();render()}
function backToExerciseList(){state.drill=false;render()}

function prevExercise(){const s=state.session;if(s.current>0){s.current--;saveActiveSession();render()}}
function finishAttempt(){
  const incomplete=state.session.items.filter(x=>!x.done).length;
  if(incomplete){
    const total=state.session.items.length;
    const done=total-incomplete;
    showConfirmModal(
      'Ainda há exercícios pendentes',
      `Você concluiu ${done} de ${total} exercícios. Deseja salvar este treino como parcial?`,
      'Voltar ao treino',
      'Salvar como parcial',
      ()=>{ closeModal(); finishSession(false); }
    );
  }else{
    showConfirmModal(
      'Concluir treino?',
      'Todos os exercícios foram registrados. O treino será salvo no histórico.',
      'Continuar treinando',
      'Finalizar treino',
      ()=>{ closeModal(); finishSession(true); }
    );
  }
}
function finishSession(complete){
  clearInterval(state.timerInterval);
  state.timerInterval=null;
  const s=state.session,w=workouts[s.key];
  const session={
    id:Date.now(),
    date:new Date().toISOString(),
    workout:s.key,
    name:w.name,
    duration:Math.max(1,Math.round((Date.now()-s.start)/60000)),
    complete,
    items:JSON.parse(JSON.stringify(s.items))

  state.history.unshift(session);
  saveHistory();
  clearActiveSession();
  state.session=null;
  state.view='history';
  state.selected=null;
  state.drill=false;
  state.timer=0;
  state.timerPaused=false;
  render();
  showSuccess(complete);
}

        const e=workouts[h.workout].exercises[i];
        return `<div class="card"><div class="row"><b>${i+1}. ${esc(e.name)}</b><span class="pill">${it.done?'Concluído':'Parcial'}</span></div>
          ${Array.isArray(it.sets)&&it.sets.length?it.sets.map((x,j)=>`<div class="detail-line"><span>Série ${j+1}</span><span>${esc(x.reps||'—')} reps · ${esc(x.weight||'—')} kg ${x.done?'✓':''}</span></div>`).join(''):''}
          ${it.effort?`<div class="detail-line"><span>RIR</span><span>${esc(it.effort)}</span></div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}
function closeModal(){document.querySelector('.modal')?.remove()}
function openWorkout(k){state.selected=k;state.view='detail';render()}
function goHome(){state.view='home';state.selected=null;state.drill=false;render()}
function goHistory(){state.view='history';render()}
try{render();}catch(err){
  console.error(err);
  document.getElementById('app').innerHTML='<div style="padding:24px;font-family:system-ui"><h2>Ops, encontrei um erro ao carregar o treino.</h2><p>Recarregue a página. Se continuar, me mande este erro: <code>'+String(err.message||err)+'</code></p></div>';
}
</script>
</body>
</html>
